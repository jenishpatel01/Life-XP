services:
  - type: web
    name: life-xp
    runtime: node
    rootDir: lifexp
    plan: free # free instances have no persistent disk: the SQLite file is wiped on restart/redeploy
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "2" # Vercel rewrite + Render load balancer
      - key: APP_URL
        sync: false # your VERCEL site URL, e.g. https://life-xp.vercel.app (used in reset links)
      - key: RESEND_API_KEY
        sync: false # optional, for emailing reset links
